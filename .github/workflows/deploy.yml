name: Deploy to Cloudflare (Worker & Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install -g wrangler@latest
          cd src/Worker && npm install

      - name: Provision / Ensure Dedicated ActaNex Demo D1 Database & Storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          echo "=== 1. Checking / Creating Dedicated ActaNex Demo D1 Database ==="
          DB_LIST=$(npx wrangler d1 list --json || echo "[]")
          DB_EXISTS=$(echo "$DB_LIST" | grep -o '"name": "actanex-demo-db"' || true)
          
          if [ -z "$DB_EXISTS" ]; then
            echo "Creating new D1 database 'actanex-demo-db'..."
            CREATE_OUTPUT=$(npx wrangler d1 create actanex-demo-db)
            echo "$CREATE_OUTPUT"
            DB_ID=$(echo "$CREATE_OUTPUT" | grep -o 'database_id = "[^"]*"' | cut -d'"' -f2 || true)
          else
            echo "D1 database 'actanex-demo-db' already exists."
            DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="actanex-demo-db") | .uuid')
          fi
          
          echo "ActaNex Demo D1 Database ID: $DB_ID"
          sed -i "s/00000000-0000-0000-0000-000000000002/$DB_ID/g" src/Worker/wrangler.jsonc

          echo "=== 2. Checking / Creating ActaNex Demo R2 Storage Bucket ==="
          npx wrangler r2 bucket create actanex-demo-storage || true

          echo "=== 3. Applying Database Schema DDL ==="
          if [ -f "src/Worker/db/init_clean_database.sql" ]; then
            echo "Executing schema DDL: init_clean_database.sql"
            npx wrangler d1 execute actanex-demo-db --remote --file="src/Worker/db/init_clean_database.sql" || true
          fi
          for sql_file in src/Worker/db/00*.sql; do
            if [ -f "$sql_file" ]; then
              echo "Executing migration: $sql_file"
              npx wrangler d1 execute actanex-demo-db --remote --file="$sql_file" || true
            fi
          done

      - name: Deploy Cloudflare Worker API (ActaNex Demo)
        working-directory: src/Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deploy Cloudflare Pages (Web UI ActaNex Demo)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: npx wrangler pages deploy src/Web --project-name=actanex-demo-web --branch=main
